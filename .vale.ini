# Vale runs only in GitHub (.github/workflows/style.yml); sessions use tools/check_citations.py. ADR 0009.
StylesPath = .github/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = FOS
# Citation tags and quotes (which may wrap across lines) aren't our wording.
TokenIgnores = (\[(?:SRC|DER|NEWS|VID|PPSARCH):[^\]]*\]), ("[^"]+"), (“[^”]+”)
