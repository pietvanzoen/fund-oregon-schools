# Vale runs only in GitHub (.github/workflows/style.yml); sessions use tools/check_citations.py. adr/20261122-1551-vale-in-ci-stdlib-in-tools.md.
StylesPath = .github/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = FOS
# Citation tags and quotes (which may wrap across lines) aren't our wording.
TokenIgnores = (\[(?:SRC|DER|NEWS|VID|PPSARCH):[^\]]*\]), ("[^"]+"), (“[^”]+”)
