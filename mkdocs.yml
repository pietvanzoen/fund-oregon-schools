# Public website for the research archive, published to GitHub Pages by .github/workflows/pages.yml.
# Pages are generated from analysis/ and sources/ by tools/site_hook.py; only About lives in website/.
site_name: Oregon Ed Trail
site_description: "Primary documents and cited analysis on Oregon K-12 funding: how much the state spends, how it's shared and what it buys, focused on the 2027-29 budget."
site_url: https://oregonedtrail.org/
copyright: Run by Oregon public school parents · <a href="mailto:hello@oregonedtrail.org">hello@oregonedtrail.org</a> · <a href="/about/">About</a> · Analysis <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
repo_url: https://github.com/pietvanzoen/fund-oregon-schools
repo_name: Research archive on GitHub
edit_uri: ""
docs_dir: website
site_dir: public

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Atkinson Hyperlegible Next
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    repo: fontawesome/brands/github

hooks:
  - tools/site_hook.py

extra_css: [assets/site.css]
extra_javascript: [assets/site.js]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Start here: index.md
  - What's being decided: decisions.md
  - Questions: questions.md
  - Topics: []  # filled by tools/site_hook.py from analysis/topics/*.md
  - People:
      - Who decides: who-decides.md
      - Gov. Tina Kotek: people/kotek.md
      - Sen. Kate Lieber: people/lieber.md
      - Rep. Tawna Sanchez: people/sanchez.md
      - Rep. Ricki Ruiz: people/ruiz.md
      - Sen. Janeen Sollman: people/sollman.md
  - Reference:
      - The numbers: numbers.md
      - What they've said: quotes.md
      - Promises tracker: promises.md
      - Timeline: timeline.md
      - Glossary: glossary.md
      - Sources: sources.md
  - What's new: updates.md
  - About this site: about.md
