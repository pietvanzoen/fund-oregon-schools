name: fetch-sources

# Downloads rows in sources/_queue.csv that aren't archived yet, extracts text, records provenance,
# and commits the result. Runs on GitHub's runners because cloud sandboxes usually can't reach
# oregon.gov or olis.oregonlegislature.gov.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch existing files too (changed ones keep the old copy in _prior/)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["sources/_queue.csv"]
  schedule:
    - cron: "17 14 * * 1"   # Mondays ~6-7am Pacific: weekly refresh to catch revised or removed documents

permissions:
  contents: write

concurrency:
  group: fetch-sources
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch queued sources
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            python3 tools/fetch_sources.py --refresh
          else
            python3 tools/fetch_sources.py
          fi
      - name: Check citations
        run: python3 tools/check_citations.py
      - name: Commit
        run: |
          git config user.name "fetch-sources bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "sources: fetch $(git diff --cached --name-only -- sources | grep -v '\.txt$' | grep -v '^sources/_' | wc -l | tr -d ' ') file(s) from queue"
          git pull -q --rebase && git push -q
