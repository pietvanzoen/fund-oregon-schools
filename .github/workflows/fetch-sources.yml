name: fetch-sources

# Downloads rows in sources/_queue.csv that aren't archived yet, extracts text, records provenance,
# and commits the result. Runs on GitHub's runners because cloud sandboxes usually can't reach
# oregon.gov or olis.oregonlegislature.gov.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch existing files too (changed ones keep the old copy in _prior/)"
        type: boolean
        default: false
  push:
    # main: after a merge. claude/**: an agent's issue branch, so one PR can queue sources, get them fetched
    # here, and then add the analysis that cites them (see .claude/plugins/fund-oregon-schools/skills/fos-work-issue/SKILL.md).
    branches: [main, "claude/**"]
    paths: ["sources/_queue.csv"]
  schedule:
    - cron: "17 14 * * 1"   # Mondays ~6-7am Pacific: weekly refresh to catch revised or removed documents

permissions:
  contents: write

concurrency:
  group: fetch-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Pushes with a deploy key, which is on the main ruleset's bypass list (personal repos can't list GitHub
      # Actions there). Without the secret, checkout falls back to GITHUB_TOKEN: branch pushes work, main is refused.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.FETCH_DEPLOY_KEY }}
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch queued sources
        id: fetch
        continue-on-error: true   # still check and commit what did download; the last step fails the job
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            python3 tools/fetch_sources.py --refresh
          else
            python3 tools/fetch_sources.py
          fi
      - name: Check citations
        run: python3 tools/check_citations.py
      # A deploy-key push triggers `check` on this commit. (A GITHUB_TOKEN push wouldn't; then the agent's next
      # commit triggers it.)
      - name: Commit
        run: |
          git config user.name "fetch-sources bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "sources: fetch $(git diff --cached --name-only -- sources | grep -v '\.txt$' | grep -v '^sources/_' | wc -l | tr -d ' ') file(s) from queue"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail if any source failed to download
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Some queued sources failed to download (listed in the job summary and the Fetch step log). They stay in the queue; re-run this workflow to retry."
          exit 1
