name: transcribe

# Writes a timestamped machine transcript next to each audio/video file in sources/ that has none yet
# (<file>.txt, lines "H:MM:SS text", matching [VID:...@H:MM:SS] citations). Never touches the media file.
# Runs on GitHub's runners because cloud sandboxes can't reach huggingface.co for the model and are too slow.

on:
  workflow_dispatch:
  push:
    # Same branches as fetch-sources, so media it fetches on an issue branch gets transcribed there too.
    # Its deploy-key push triggers this; a GITHUB_TOKEN push (no FETCH_DEPLOY_KEY) wouldn't: run it by hand then.
    branches: [main, "claude/**"]
    paths: ["sources/**/*.mp4", "sources/**/*.m4a", "sources/**/*.mp3", "sources/**/*.wav", "sources/**/*.webm"]

permissions:
  contents: write

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.FETCH_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # av pinned: av 19 dropped the open() argument faster-whisper 1.2.1 passes (metadata_errors)
      - run: pip install -q faster-whisper==1.2.1 av==17.0.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small.en
      - name: Transcribe
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, "tools")
          from common import MEDIA, SOURCES
          from faster_whisper import WhisperModel

          # shortcut: small.en int8 on the 4-CPU runner, roughly 3-4x faster than real time (a 3-hour hearing in
          # about an hour) with some misheard words and names; switch to medium.en if quotes keep needing fixes,
          # at about 3x the run time (a 3-hour hearing then nears the 6-hour job limit).
          MODEL = "small.en"
          todo = []
          for d, dirs, files in os.walk(SOURCES):
              dirs[:] = [x for x in dirs if x != "_prior"]
              todo += [os.path.join(d, f) for f in sorted(files)
                       if f.lower().endswith(MEDIA) and not os.path.exists(os.path.join(d, f) + ".txt")]
          print(f"{len(todo)} file(s) to transcribe")
          model = WhisperModel(MODEL, device="cpu", compute_type="int8") if todo else None
          for path in todo:
              print("-", os.path.relpath(path, SOURCES), flush=True)
              lines = [f"# Machine transcript (faster-whisper {MODEL}), not checked by a person. "
                       "Listen to the recording to verify any quote before citing it."]
              for s in model.transcribe(path)[0]:
                  t = int(s.start)
                  lines.append(f"{t // 3600}:{t // 60 % 60:02}:{t % 60:02} {s.text.strip()}")
              # written only when complete, so a cancelled run leaves no partial transcript to commit
              with open(path + ".txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
      - name: Commit
        if: always()   # keep the transcripts that finished even if a later file failed
        run: |
          git config user.name "transcribe bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "sources: transcribe $(git diff --cached --name-only | wc -l | tr -d ' ') file(s)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
