name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Citations and data files
        run: python3 tools/check_citations.py
      - name: Queue and archived files
        run: python3 tools/check_sources.py
      - name: Tool smoke tests
        run: python3 tools/test_tools.py
      - name: Derived figures match their scripts
        run: |
          shopt -s nullglob
          for f in tools/derive_*.py; do python3 "$f"; done
          git add --intent-to-add analysis/derived/ 2>/dev/null || true  # a new, uncommitted output shows in the diff too
          git diff --exit-code -- analysis/derived/
