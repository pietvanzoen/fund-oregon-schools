# Vale style check on reader-facing pages. Comments on added lines only; never blocks a merge. adr/20261122-1551-vale-in-ci-stdlib-in-tools.md.
name: style
on:
  pull_request:
    paths:
      - "analysis/**.md"
      - "STYLE.md"
      - ".vale.ini"
      - ".github/styles/**"
      - ".github/workflows/style.yml"
permissions:
  contents: read
  checks: write
  pull-requests: read
jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.13.0
          sync: false
          files: '["analysis/START.md", "analysis/decisions.md", "analysis/timeline.md", "analysis/topics", "analysis/people"]'
          filter_mode: added
          reporter: github-pr-check
          fail_on_error: false
