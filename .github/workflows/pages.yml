name: website

# Builds the public site (site-11ty/, Eleventy) from analysis/ and sources/ on every PR (to catch breakage) and deploys it
# to GitHub Pages on pushes to main. Repo settings needed once: Settings → Pages → Source: GitHub Actions, and the custom
# domain oregonedtrail.org (an Actions deploy reads it from there; site-11ty/src/CNAME only records it).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"  # daily rebuild so the overview's "Coming up" dates stay current

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for "last updated" dates
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site-11ty/package-lock.json
      - name: Citations and data files
        run: python3 tools/check_citations.py
      - name: Install site dependencies
        working-directory: site-11ty
        run: npm ci
      # Eleventy fails the build on a broken internal link or an unknown [[id]]; Pagefind indexes search inside it
      - name: Build site
        working-directory: site-11ty
        run: npx eleventy
      # Markup and accessibility rules a browser isn't needed for: alt text, names on controls, heading order, ARIA
      - name: Validate built HTML (html-validate)
        working-directory: site-11ty
        run: npx html-validate _site
      - name: Lint and format site code (Biome)
        if: ${{ !cancelled() }}  # report alongside a failed build or HTML check, not instead of them
        working-directory: site-11ty
        run: npx biome ci
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-11ty/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
